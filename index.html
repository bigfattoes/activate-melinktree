<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0717">
  <title>ActivateMe™ Fest · Links</title>
  <meta name="description" content="Everything ActivateMe™ Fest in one place. 16–17 Jan 2027, Dubai Silicon Oasis.">
  <meta property="og:title" content="ActivateMe™ Fest · 16–17 Jan 2027">
  <meta property="og:description" content="Try the Become Acti filter, take the quiz, grab the stickers and find us.">
  <meta property="og:image" content="og.jpg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- iPhones and Macs use SF Pro (the system font). Inter is the closest match for everyone else. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0717;
      --card: rgba(255, 255, 255, .07);
      --card-hi: rgba(255, 255, 255, .12);
      --hairline: rgba(255, 255, 255, .1);
      --text: #fff;
      --text-2: rgba(235, 235, 245, .62);
      --text-3: rgba(235, 235, 245, .38);
      --purple: #6b2cff;
      --pink: #f83840;
      --orange: #fc8700;
      --radius: 22px;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, system-ui, "Segoe UI", Roboto, sans-serif;
      font-size: 17px;
      letter-spacing: -.01em;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    /* Soft brand glow behind everything */
    body::before {
      content: ""; position: fixed; inset: -20vh -20vw auto; height: 90vh; z-index: -1;
      background:
        radial-gradient(40% 50% at 25% 40%, rgba(107, 44, 255, .55), transparent 70%),
        radial-gradient(35% 45% at 80% 30%, rgba(248, 56, 64, .32), transparent 70%),
        radial-gradient(30% 40% at 60% 75%, rgba(252, 135, 0, .22), transparent 70%);
      filter: blur(40px);
    }
    main {
      max-width: 460px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 40px) 16px calc(env(safe-area-inset-bottom) + 40px);
    }

    /* ---------- Header ---------- */
    .hero { text-align: center; }
    .app-icon {
      width: 84px; height: 84px; margin: 0 auto 16px;
      display: grid; place-items: center;
      border-radius: 22.5%;
      background: #fff;
      box-shadow: 0 12px 32px rgba(107, 44, 255, .45), inset 0 0 0 .5px rgba(0, 0, 0, .08);
    }
    .app-icon img { width: 60%; height: auto; }
    h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.025em; line-height: 1.1; }
    .sub { margin: 6px 0 0; font-size: 15px; color: var(--text-2); }

    .countdown {
      display: inline-flex; align-items: baseline; gap: 2px;
      margin-top: 18px; padding: 8px 16px;
      border-radius: 99px;
      background: var(--card);
      border: .5px solid var(--hairline);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      font-variant-numeric: tabular-nums;
    }
    .countdown b { font-size: 17px; font-weight: 600; }
    .countdown span { font-size: 13px; color: var(--text-2); margin-right: 10px; }
    .countdown span:last-child { margin-right: 0; }

    /* ---------- Section titles ---------- */
    .section-title {
      display: flex; justify-content: space-between; align-items: baseline;
      margin: 34px 4px 10px;
      font-size: 22px; font-weight: 700; letter-spacing: -.02em;
    }
    .section-title a { font-size: 15px; font-weight: 500; color: #a98bff; text-decoration: none; letter-spacing: 0; }

    /* ---------- Feature tiles (AR filter + quiz) ---------- */
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 30px; }
    .tile {
      position: relative; overflow: hidden;
      aspect-ratio: 1 / 1.12;
      padding: 16px;
      border-radius: var(--radius);
      color: #fff; text-decoration: none;
      display: flex; flex-direction: column;
      box-shadow: 0 18px 40px -18px rgba(0, 0, 0, .7), inset 0 0 0 .5px rgba(255, 255, 255, .25);
      transition: transform .35s var(--ease);
    }
    .tile:active { transform: scale(.97); }
    .tile.ar { background: linear-gradient(155deg, #7b3cff 0%, #4a01e0 55%, #2a0a8f 100%); }
    .tile.quiz { background: linear-gradient(155deg, #ff9f2e 0%, #f83840 60%, #b0157a 100%); }
    .tile::after { /* glossy top sheen */
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, .18), transparent 40%);
      pointer-events: none;
    }
    .tile .chip {
      align-self: flex-start;
      padding: 3px 8px; border-radius: 99px;
      background: rgba(255, 255, 255, .22);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    }
    .tile h3 { position: relative; z-index: 1; margin: 10px 0 0; font-size: 20px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
    .tile p { position: relative; z-index: 1; margin: 4px 0 0; font-size: 13px; color: rgba(255, 255, 255, .8); max-width: 60%; }
    .tile img {
      position: absolute; right: -6px; bottom: -10px;
      height: 64%; width: auto;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .35));
      transition: transform .5s var(--ease);
    }
    .tile.quiz img { right: 2px; }
    .tile:hover img { transform: translateY(-4px) rotate(-2deg); }
    .tile .go {
      position: absolute; left: 16px; bottom: 16px; z-index: 1;
      width: 32px; height: 32px; border-radius: 50%;
      display: grid; place-items: center;
      background: #fff; color: #1b0b46;
    }
    .tile .go svg { width: 14px; height: 14px; }

    /* ---------- Reels ---------- */
    .reels {
      display: flex; gap: 10px;
      margin: 0 -16px; padding: 0 16px 4px;
      overflow-x: auto; scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .reels::-webkit-scrollbar { display: none; }
    .reel {
      position: relative; flex: none;
      width: 42%; max-width: 180px; aspect-ratio: 9 / 16;
      border-radius: 18px; overflow: hidden;
      scroll-snap-align: start; scroll-margin-left: 16px;
      background: #1a1030;
      box-shadow: inset 0 0 0 .5px var(--hairline);
      transition: transform .35s var(--ease);
    }
    .reel:active { transform: scale(.97); }
    .reel video, .reel img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .reel .badge {
      position: absolute; right: 10px; bottom: 10px;
      width: 28px; height: 28px; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(0, 0, 0, .35);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .reel .badge svg { width: 14px; height: 14px; }
    .reel.more {
      display: grid; place-items: center; text-align: center; padding: 16px;
      background: linear-gradient(160deg, #2a1660, #120a26);
      color: #fff; text-decoration: none;
    }
    .reel.more .ig { width: 52px; height: 52px; margin: 0 auto 10px; border-radius: 16px; }
    .reel.more b { display: block; font-size: 15px; }
    .reel.more span { font-size: 13px; color: var(--text-2); }

    /* ---------- Inset grouped list (iOS Settings style) ---------- */
    .group {
      border-radius: var(--radius); overflow: hidden;
      background: var(--card);
      border: .5px solid var(--hairline);
      backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
    }
    .row {
      display: flex; align-items: center; gap: 14px;
      width: 100%; min-height: 60px; padding: 10px 16px;
      border: 0; background: none; font: inherit; color: inherit; text-align: left;
      text-decoration: none; cursor: pointer;
      position: relative;
      transition: background .2s;
    }
    .row:active { background: var(--card-hi); }
    .row + .row::before {
      content: ""; position: absolute; top: 0; right: 0; left: 64px;
      border-top: .5px solid var(--hairline);
    }
    .row .ico {
      flex: none; width: 34px; height: 34px; border-radius: 9px;
      display: grid; place-items: center; color: #fff;
    }
    .row .ico svg { width: 19px; height: 19px; }
    .row .txt { flex: 1; min-width: 0; }
    .row .txt b { display: block; font-size: 17px; font-weight: 500; }
    .row .txt small { display: block; margin-top: 1px; font-size: 14px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .chev { flex: none; width: 8px; height: 13px; color: var(--text-3); }
    .row.soon { opacity: .5; pointer-events: none; }

    .bg-maps { background: linear-gradient(180deg, #34c759, #1f9e45); }
    .bg-cal { background: linear-gradient(180deg, #ff5a5f, #e5212c); }
    .bg-wa { background: linear-gradient(180deg, #3ee07a, #1fae55); }
    .bg-ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285aeb 95%); }
    .bg-tt { background: #000; box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .2); }
    .bg-li { background: #0a66c2; }

    footer { margin-top: 36px; text-align: center; font-size: 13px; color: var(--text-3); }

    /* ---------- Bottom sheets ---------- */
    dialog.sheet {
      width: 100%; max-width: 460px; max-height: 88vh;
      margin: auto auto 0; padding: 8px 16px calc(env(safe-area-inset-bottom) + 16px);
      border: 0; border-radius: 28px 28px 0 0;
      background: rgba(30, 24, 44, .92);
      backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
      color: var(--text);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, .4);
    }
    dialog.sheet[open] { animation: up .45s var(--ease); }
    dialog.sheet::backdrop { background: rgba(0, 0, 0, .45); animation: fade .3s; }
    @keyframes up { from { transform: translateY(100%); } }
    @keyframes fade { from { opacity: 0; } }
    .grabber { width: 36px; height: 5px; margin: 0 auto 14px; border-radius: 99px; background: rgba(255, 255, 255, .25); }
    .sheet h2 { margin: 0 4px 4px; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
    .sheet .hint { margin: 0 4px 14px; font-size: 14px; color: var(--text-2); }
    .sheet .group { background: rgba(255, 255, 255, .06); }
    .sheet .row { min-height: 54px; }
    .sheet .cancel {
      display: block; width: 100%; margin-top: 10px; padding: 15px;
      border: 0; border-radius: 16px;
      background: rgba(255, 255, 255, .1); color: #fff;
      font: inherit; font-weight: 600;
    }

    .segmented {
      display: grid; grid-template-columns: 1fr 1fr; padding: 2px; margin-bottom: 14px;
      border-radius: 10px; background: rgba(255, 255, 255, .1);
    }
    .segmented button {
      padding: 7px; border: 0; border-radius: 8px;
      background: none; color: #fff; font: inherit; font-size: 14px; font-weight: 600;
    }
    .segmented button[aria-pressed="true"] { background: rgba(255, 255, 255, .22); box-shadow: 0 3px 8px rgba(0, 0, 0, .2); }
    .sticker-grid {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;
      max-height: 46vh; overflow-y: auto;
    }
    .sticker-grid a { display: block; aspect-ratio: 1; border-radius: 14px; padding: 4px; background: rgba(255, 255, 255, .04); }
    .sticker-grid a:active { background: rgba(255, 255, 255, .12); }
    .sticker-grid img { width: 100%; height: 100%; object-fit: contain; }
    .primary {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; margin-top: 14px; padding: 15px;
      border-radius: 16px; border: 0;
      background: #25d366; color: #04210f;
      font: inherit; font-weight: 700; text-decoration: none;
    }
    .primary.off { background: rgba(255, 255, 255, .1); color: var(--text-2); pointer-events: none; font-weight: 600; }

    @media (hover: hover) { .row:hover { background: rgba(255, 255, 255, .05); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="app-icon"><img src="logo.webp" alt="ActivateMe Fest"></div>
      <h1>ActivateMe™ Fest</h1>
      <p class="sub" id="sub"></p>
      <div class="countdown" aria-label="Countdown to the festival">
        <b id="cd-d">--</b><span>days</span>
        <b id="cd-h">--</b><span>hrs</span>
        <b id="cd-m">--</b><span>min</span>
      </div>
    </header>

    <div class="tiles" id="tiles"></div>

    <div class="section-title"><span>Reels</span><a id="reels-all" href="#">See all</a></div>
    <div class="reels" id="reels"></div>

    <div class="section-title"><span>Plan your visit</span></div>
    <div class="group">
      <button class="row" data-sheet="maps-sheet">
        <span class="ico bg-maps" data-icon="pin"></span>
        <span class="txt"><b>Find us</b><small id="venue-line"></small></span>
        <span data-icon="chev"></span>
      </button>
      <button class="row" data-sheet="cal-sheet">
        <span class="ico bg-cal" data-icon="cal"></span>
        <span class="txt"><b>Add to calendar</b><small id="date-line"></small></span>
        <span data-icon="chev"></span>
      </button>
      <button class="row" data-sheet="stickers-sheet">
        <span class="ico bg-wa" data-icon="smile"></span>
        <span class="txt"><b>Acti stickers</b><small>31 free stickers for WhatsApp</small></span>
        <span data-icon="chev"></span>
      </button>
    </div>

    <div class="section-title"><span>Follow us</span></div>
    <div class="group" id="social"></div>

    <footer>© ActivateMe™ Fest · MWAN Events</footer>
  </main>

  <!-- Maps action sheet -->
  <dialog class="sheet" id="maps-sheet">
    <div class="grabber"></div>
    <h2 id="maps-title"></h2>
    <p class="hint" id="maps-hint"></p>
    <div class="group">
      <a class="row" id="apple-maps" target="_blank" rel="noopener"><span class="ico bg-maps" data-icon="pin"></span><span class="txt"><b>Apple Maps</b></span><span data-icon="chev"></span></a>
      <a class="row" id="google-maps" target="_blank" rel="noopener"><span class="ico" style="background:#fff;color:#1a73e8" data-icon="pin"></span><span class="txt"><b>Google Maps</b></span><span data-icon="chev"></span></a>
    </div>
    <form method="dialog"><button class="cancel">Cancel</button></form>
  </dialog>

  <!-- Calendar action sheet -->
  <dialog class="sheet" id="cal-sheet">
    <div class="grabber"></div>
    <h2>Save the date</h2>
    <p class="hint" id="cal-hint"></p>
    <div class="group">
      <a class="row" id="ics-link" href="activatemefest-2027.ics" download><span class="ico bg-cal" data-icon="cal"></span><span class="txt"><b>Apple Calendar</b><small>Also Outlook and others</small></span><span data-icon="chev"></span></a>
      <a class="row" id="gcal-link" target="_blank" rel="noopener"><span class="ico" style="background:#fff;color:#1a73e8" data-icon="cal"></span><span class="txt"><b>Google Calendar</b></span><span data-icon="chev"></span></a>
    </div>
    <form method="dialog"><button class="cancel">Cancel</button></form>
  </dialog>

  <!-- Stickers sheet -->
  <dialog class="sheet" id="stickers-sheet">
    <div class="grabber"></div>
    <h2>Acti stickers</h2>
    <p class="hint" id="stickers-hint"></p>
    <div class="segmented" role="group">
      <button type="button" data-pack="acti" aria-pressed="true">Acti</button>
      <button type="button" data-pack="sports" aria-pressed="false">Acti Sports</button>
    </div>
    <div class="sticker-grid" id="sticker-grid"></div>
    <a class="primary" id="wa-add" target="_blank" rel="noopener"></a>
    <form method="dialog"><button class="cancel">Done</button></form>
  </dialog>

  <script>
    // ===================== EDIT THE PAGE HERE =====================
    const EVENT = {
      dates: "16–17 Jan 2027",
      start: "2027-01-16T10:00:00+04:00", // Dubai time, for the countdown
      calStart: "20270116", calEnd: "20270118", // all-day, end is the day after
      venue: "Dubai Silicon Oasis",
      // Exact venue: paste a Google Maps pin link here (Share → Copy link).
      // Until then the map searches for `venue` above.
      mapsUrl: "",

      coords: "",

    // The two big tiles at the top

      { title: "Put on Acti's cap", video: "reels/launch.mp4", poster: "reels/launch.jpg", url: "" },
    ];

    const SOCIAL = [
      { icon: "instagram", bg: "bg-ig", title: "Instagram", note: "@activatemefest", url: INSTAGRAM },
      { icon: "tiktok", bg: "bg-tt", title: "TikTok", note: "@activatemefest", url: "https://www.tiktok.com/@activatemefest" },
      { icon: "linkedin", bg: "bg-li", title: "LinkedIn", note: "ActivateMe Fest", url: "https://www.linkedin.com/company/activateme-fest/" },
    ];

    // Stickers. Once the packs are published (e.g. on Sticker.ly), paste the link here
    // and the green "Add to WhatsApp" button turns on.
    const WHATSAPP_STICKERS_URL = "";
    const STICKERS = {
      acti: ["01_lol", "02_hmm", "03_hi", "04_on_my_way", "05_mabrook", "06_lets_go", "07_love_you", "08_good_morning", "09_shukran",

               "10_game_on", "11_checkmate", "12_get_creative", "13_activateme"],
    };
    // ==============================================================

    const ICONS = {
      chev: '<svg class="chev" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5-5 5"/></svg>',
      arrow: '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 11 3M5 3h6v6"/></svg>',

      instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
      tiktok: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 3c.4 2.3 1.9 3.9 4.4 4.1v3.2c-1.6.1-3-.4-4.4-1.3v6.2c0 3.6-2.7 6.1-6.1 6.1A6 6 0 0 1 4.4 15c0-3.6 3-6.3 6.8-5.9v3.3c-1.9-.4-3.5.8-3.5 2.6 0 1.5 1.2 2.7 2.8 2.7 1.7 0 2.8-1.2 2.8-3.1V3h3.3Z"/></svg>',
      linkedin: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.5 3.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4ZM3 9h3v12H3V9Zm6 0h2.9v1.7c.5-.9 1.7-2 3.6-2 3.2 0 4.5 2 4.5 5.4V21h-3v-6.2c0-1.7-.3-3.1-2.1-3.1-1.8 0-2.2 1.3-2.2 3V21H9V9Z"/></svg>',
      whatsapp: '<svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.4 14.1c-.2.6-1.3 1.2-1.8 1.3-.5 0-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.5 1.9 1 .9 1.9 1.2 2.2 1.3.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3Z"/></svg>',
    };
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const $ = (id) => document.getElementById(id);
    const enc = encodeURIComponent;

    // Header
    $("sub").textContent = `${EVENT.dates} · ${EVENT.venue}`;
    $("venue-line").textContent = EVENT.venue;
    $("date-line").textContent = EVENT.dates;

    // Feature tiles
    $("tiles").innerHTML = FEATURED.map((f) => `
      <a class="tile ${f.cls}" href="${esc(f.url)}">
        <span class="chip">${esc(f.chip)}</span>
        <h3>${esc(f.title)}</h3>
        <p>${esc(f.note)}</p>
        <img src="${esc(f.img)}" alt="" loading="eager">
        <span class="go" aria-hidden="true">${ICONS.arrow}</span>
      </a>`).join("");

    // Reels
    $("reels-all").href = INSTAGRAM;
    $("reels").innerHTML = REELS.map((r) => `
      <a class="reel" href="${esc(r.url || INSTAGRAM)}" target="_blank" rel="noopener" aria-label="${esc(r.title)} on Instagram">
        <video src="${esc(r.video)}" poster="${esc(r.poster)}" muted loop playsinline preload="none"></video>
        <span class="badge">${ICONS.instagram}</span>
      </a>`).join("") + `
      <a class="reel more" href="${esc(INSTAGRAM)}" target="_blank" rel="noopener">
        <div><span class="ico ig bg-ig" style="display:grid;place-items:center">${ICONS.instagram.replace("<svg", '<svg width="26" height="26"')}</span>
        <b>More on Instagram</b><span>@activatemefest</span></div>
      </a>`;
    // Play reels only while they're on screen
    const io = new IntersectionObserver((entries) => entries.forEach((e) => {
      const v = e.target;
      if (e.isIntersecting) { v.preload = "auto"; v.play().catch(() => {}); } else v.pause();
    }), { threshold: .6 });
    document.querySelectorAll(".reel video").forEach((v) => io.observe(v));

    // Social rows
    $("social").innerHTML = SOCIAL.map((s) => `
      <a class="row" href="${esc(s.url)}" target="_blank" rel="noopener">
        <span class="ico ${s.bg}">${ICONS[s.icon]}</span>
        <span class="txt"><b>${esc(s.title)}</b><small>${esc(s.note)}</small></span>
        ${ICONS.chev}
      </a>`).join("");

    // Fill icon placeholders
    document.querySelectorAll("[data-icon]").forEach((el) => {
      if (el.dataset.icon === "chev") el.outerHTML = ICONS.chev; else el.innerHTML = ICONS[el.dataset.icon];
    });

    // Sheets
    document.querySelectorAll("[data-sheet]").forEach((b) => b.addEventListener("click", () => $(b.dataset.sheet).showModal()));
    document.querySelectorAll("dialog.sheet").forEach((d) => d.addEventListener("click", (e) => { if (e.target === d) d.close(); }));

    // Maps
    $("maps-title").textContent = EVENT.venue;
    $("maps-hint").textContent = `${EVENT.dates} · Open directions in`;
    $("google-maps").href = EVENT.mapsUrl || `https://www.google.com/maps/search/?api=1&query=${enc(EVENT.coords || EVENT.venue + ", Dubai")}`;
    $("apple-maps").href = EVENT.coords
      ? `https://maps.apple.com/?ll=${enc(EVENT.coords)}&q=${enc(EVENT.venue)}`
      : `https://maps.apple.com/?q=${enc(EVENT.venue + ", Dubai")}`;

    // Calendar
    $("cal-hint").textContent = `ActivateMe™ Fest · ${EVENT.dates}`;
    $("gcal-link").href = "https://calendar.google.com/calendar/render?action=TEMPLATE"
      + `&text=${enc("ActivateMe™ Fest")}&dates=${EVENT.calStart}/${EVENT.calEnd}`
      + `&location=${enc(EVENT.venue + ", Dubai")}`
      + `&details=${enc("Family festival with 100+ activities. Try the Become Acti filter: https://becomeacti.pages.dev")}`;

    // Stickers
    function showPack(pack) {
      document.querySelectorAll(".segmented button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.pack === pack));
      $("sticker-grid").innerHTML = STICKERS[pack].map((n) => {
        const src = `stickers/${pack}/${n}.webp`;
        return `<a href="${src}" download="acti-${n.replace(/^\d+_/, "")}.webp"><img src="${src}" alt="${esc(n.replace(/^\d+_/, "").replace(/_/g, " "))}" loading="lazy"></a>`;
      }).join("");
    }
    document.querySelectorAll(".segmented button").forEach((b) => b.addEventListener("click", () => showPack(b.dataset.pack)));
    showPack("acti");
    const wa = $("wa-add");
    if (WHATSAPP_STICKERS_URL) {
      wa.href = WHATSAPP_STICKERS_URL;
      wa.innerHTML = `${ICONS.whatsapp} Add to WhatsApp`;
      $("stickers-hint").textContent = "Tap below to add both packs to WhatsApp.";
    } else {
      wa.classList.add("off");
      wa.textContent = "WhatsApp pack coming soon";
      $("stickers-hint").textContent = "Tap a sticker to save it, then send it in any chat.";
    }

    // Countdown
    const START = new Date(EVENT.start);
    const pad = (n) => String(n).padStart(2, "0");
    function tick() {
      const ms = Math.max(0, START - Date.now());
      $("cd-d").textContent = Math.floor(ms / 864e5);
      $("cd-h").textContent = pad(Math.floor((ms % 864e5) / 36e5));
      $("cd-m").textContent = pad(Math.floor((ms % 36e5) / 6e4));
    }
    tick();
    setInterval(tick, 30000);
  </script>
</body>
</html>
